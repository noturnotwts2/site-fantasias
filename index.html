<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Fantasias</title>
<style>
  :root {
    --bg: #fdf6f0;
    --card: #ffffff;
    --primary: #d9455f;
    --primary-dark: #b7314a;
    --accent: #f4a53f;
    --text: #3a2b2b;
    --muted: #8a7a7a;
    --border: #f0e0d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, var(--bg), #fff);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 4px;
    color: var(--primary-dark);
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 24px;
    font-size: 0.95rem;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }
  .form-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  .form-row > div { flex: 1; min-width: 140px; }
  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 4px;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 0.95rem;
    background: #fffaf7;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--primary);
  }
  .btn {
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: white; width: 100%; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: var(--accent); color: white; }
  .btn-outline {
    background: transparent;
    border: 1.5px solid var(--primary);
    color: var(--primary-dark);
  }
  .actions-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .actions-row .btn { flex: 1; min-width: 150px; }

  .list-title {
    font-size: 1rem;
    font-weight: 700;
    margin: 0 0 12px;
    color: var(--primary-dark);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .count-badge {
    background: var(--primary);
    color: white;
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.8rem;
  }
  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 0.92rem;
  }
  .item:last-child { border-bottom: none; }
  .item-name { font-weight: 600; }
  .item-meta { color: var(--muted); font-size: 0.82rem; }
  .item-del {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 4px 8px;
  }
  .item-del:hover { color: var(--primary); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 20px 0;
    font-size: 0.9rem;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
  }
  th, td {
    text-align: left;
    padding: 9px 6px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  td.qty { font-weight: 700; color: var(--primary-dark); text-align: right; }
  tr.total-row td { border-top: 2px solid var(--primary); font-weight: 700; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(30,15,15,0.45);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 10;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 16px;
    padding: 22px;
    max-width: 480px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal h2 {
    margin-top: 0;
    color: var(--primary-dark);
    font-size: 1.2rem;
  }
  .modal-close {
    display: block;
    margin: 16px auto 0;
  }
  .loading, .status {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 6px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎭 Catálogo de Fantasias</h1>
  <div class="subtitle">Controle de estoque — fantasias de 2 a 12 anos</div>

  <div class="card">
    <div class="form-row">
      <div>
        <label for="nome">Nome da fantasia</label>
        <input id="nome" type="text" placeholder="Ex: Homem-Aranha, Frozen, Super-Herói..." />
      </div>
      <div>
        <label for="tamanho">Tamanho / Idade</label>
        <select id="tamanho">
          <option value="2 anos">2 anos</option>
          <option value="3 anos">3 anos</option>
          <option value="4 anos">4 anos</option>
          <option value="5 anos">5 anos</option>
          <option value="6 anos">6 anos</option>
          <option value="7 anos">7 anos</option>
          <option value="8 anos">8 anos</option>
          <option value="9 anos">9 anos</option>
          <option value="10 anos">10 anos</option>
          <option value="11 anos">11 anos</option>
          <option value="12 anos">12 anos</option>
        </select>
      </div>
      <div>
        <label for="valor">Valor (R$)</label>
        <input id="valor" type="number" step="0.01" min="0" placeholder="Ex: 59.90" />
      </div>
    </div>
    <button class="btn btn-primary" onclick="addItem()">+ Adicionar fantasia</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <div class="list-title">
      <span>Itens adicionados</span>
      <span class="count-badge" id="totalCount">0</span>
    </div>
    <div id="itemList"><div class="empty">Nenhuma fantasia adicionada ainda.</div></div>
  </div>

  <div class="actions-row">
    <button class="btn btn-secondary" onclick="openReport()">📊 Ver Relatório / Total</button>
    <button class="btn btn-outline" onclick="clearAll()">🗑️ Limpar tudo</button>
  </div>
  <div class="actions-row">
    <button class="btn btn-outline" onclick="exportCSV()">⬇️ Baixar CSV</button>
    <button class="btn btn-outline" onclick="exportJSON()">⬇️ Baixar JSON</button>
  </div>
</div>

<div class="modal-overlay" id="reportModal">
  <div class="modal">
    <h2>Relatório — Quantidade e valor por modelo</h2>
    <div class="form-row" style="margin-bottom:14px;">
      <div>
        <label for="filtroNome">Buscar por nome</label>
        <input id="filtroNome" type="text" placeholder="Ex: Frozen" oninput="renderReport()" />
      </div>
      <div>
        <label for="filtroIdade">Idade / Tamanho</label>
        <select id="filtroIdade" onchange="renderReport()">
          <option value="">Todas</option>
          <option value="2 anos">2 anos</option>
          <option value="3 anos">3 anos</option>
          <option value="4 anos">4 anos</option>
          <option value="5 anos">5 anos</option>
          <option value="6 anos">6 anos</option>
          <option value="7 anos">7 anos</option>
          <option value="8 anos">8 anos</option>
          <option value="9 anos">9 anos</option>
          <option value="10 anos">10 anos</option>
          <option value="11 anos">11 anos</option>
          <option value="12 anos">12 anos</option>
        </select>
      </div>
    </div>
    <table>
      <thead>
        <tr><th>Modelo</th><th style="text-align:right">Qtd.</th><th style="text-align:right">Valor un.</th><th style="text-align:right">Subtotal</th></tr>
      </thead>
      <tbody id="reportBody"></tbody>
    </table>
    <button class="btn btn-outline modal-close" onclick="closeReport()">Fechar</button>
  </div>
</div>

<script>
let items = [];
const STORAGE_KEY = 'fantasias:items';

function setStatus(msg) {
  document.getElementById('status').textContent = msg || '';
  if (msg) setTimeout(() => { document.getElementById('status').textContent = ''; }, 2000);
}

async function loadItems() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    items = raw ? JSON.parse(raw) : [];
  } catch (e) {
    items = [];
  }
  render();
}

async function saveItems() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  } catch (e) {
    setStatus('Erro ao salvar. Tente novamente.');
  }
}

function normalize(str) {
  return str.trim().toLowerCase();
}

async function addItem() {
  const nomeInput = document.getElementById('nome');
  const tamanhoInput = document.getElementById('tamanho');
  const valorInput = document.getElementById('valor');
  const nome = nomeInput.value.trim();
  if (!nome) {
    setStatus('Digite o nome da fantasia.');
    return;
  }
  const valor = valorInput.value !== '' ? parseFloat(valorInput.value) : null;
  items.push({
    id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
    nome: nome,
    nomeKey: normalize(nome),
    tamanho: tamanhoInput.value,
    valor: (valor !== null && !isNaN(valor)) ? valor : null
  });
  nomeInput.value = '';
  nomeInput.focus();
  render();
  await saveItems();
}

async function removeItem(id) {
  items = items.filter(i => i.id !== id);
  render();
  await saveItems();
}

async function clearAll() {
  if (items.length && !confirm('Tem certeza que deseja apagar todos os itens catalogados?')) return;
  items = [];
  render();
  await saveItems();
}

function render() {
  const listEl = document.getElementById('itemList');
  const totalEl = document.getElementById('totalCount');
  totalEl.textContent = items.length;

  if (items.length === 0) {
    listEl.innerHTML = '<div class="empty">Nenhuma fantasia adicionada ainda.</div>';
    return;
  }

  // most recent first
  const sorted = [...items].reverse();
  listEl.innerHTML = sorted.map(i => `
    <div class="item">
      <div>
        <div class="item-name">${escapeHtml(i.nome)}</div>
        <div class="item-meta">${escapeHtml(i.tamanho)}${i.valor !== null && i.valor !== undefined ? ' · ' + formatMoney(i.valor) : ''}</div>
      </div>
      <button class="item-del" onclick="removeItem('${i.id}')" title="Remover">✕</button>
    </div>
  `).join('');
}

function formatMoney(v) {
  return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function openReport() {
  document.getElementById('reportModal').classList.add('open');
  renderReport();
}

function renderReport() {
  const nomeFiltro = normalize(document.getElementById('filtroNome').value);
  const idadeFiltro = document.getElementById('filtroIdade').value;

  const filtered = items.filter(i => {
    const matchNome = !nomeFiltro || i.nomeKey.includes(nomeFiltro);
    const matchIdade = !idadeFiltro || i.tamanho === idadeFiltro;
    return matchNome && matchIdade;
  });

  const counts = {};
  const displayNames = {};
  const lastValor = {};
  filtered.forEach(i => {
    counts[i.nomeKey] = (counts[i.nomeKey] || 0) + 1;
    displayNames[i.nomeKey] = i.nome;
    if (i.valor !== null && i.valor !== undefined) lastValor[i.nomeKey] = i.valor;
  });
  let grandTotalValue = 0;
  let hasAnyValue = false;
  const rows = Object.keys(counts)
    .sort((a, b) => counts[b] - counts[a])
    .map(k => {
      const qty = counts[k];
      const valor = lastValor[k];
      const subtotal = valor !== undefined ? valor * qty : null;
      if (subtotal !== null) { grandTotalValue += subtotal; hasAnyValue = true; }
      return `<tr>
        <td>${escapeHtml(displayNames[k])}</td>
        <td class="qty">${qty}</td>
        <td class="qty">${valor !== undefined ? formatMoney(valor) : '—'}</td>
        <td class="qty">${subtotal !== null ? formatMoney(subtotal) : '—'}</td>
      </tr>`;
    })
    .join('');
  const total = filtered.length;
  document.getElementById('reportBody').innerHTML =
    (rows || '<tr><td colspan="4" style="text-align:center;color:var(--muted)">Nenhum item encontrado com esses filtros.</td></tr>')
    + `<tr class="total-row"><td>Total ${nomeFiltro || idadeFiltro ? 'filtrado' : 'geral'}</td><td class="qty">${total}</td><td></td><td class="qty">${hasAnyValue ? formatMoney(grandTotalValue) : '—'}</td></tr>`;
}

function closeReport() {
  document.getElementById('reportModal').classList.remove('open');
  document.getElementById('filtroNome').value = '';
  document.getElementById('filtroIdade').value = '';
}

document.getElementById('nome').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addItem();
});

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function exportJSON() {
  if (!items.length) { setStatus('Nenhum item para exportar.'); return; }
  const content = JSON.stringify(items.map(i => ({
    nome: i.nome,
    tamanho: i.tamanho,
    valor: i.valor !== null && i.valor !== undefined ? i.valor : null
  })), null, 2);
  downloadFile(`catalogo-fantasias-${todayStr()}.json`, content, 'application/json');
}

function csvEscape(val) {
  const s = String(val);
  if (s.includes(',') || s.includes('"') || s.includes('\n')) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function exportCSV() {
  if (!items.length) { setStatus('Nenhum item para exportar.'); return; }
  const rows = [['Nome', 'Tamanho', 'Valor']];
  items.forEach(i => rows.push([i.nome, i.tamanho, i.valor !== null && i.valor !== undefined ? i.valor.toFixed(2) : '']));

  // add a summary block with totals per model
  const counts = {};
  const displayNames = {};
  const lastValor = {};
  items.forEach(i => {
    counts[i.nomeKey] = (counts[i.nomeKey] || 0) + 1;
    displayNames[i.nomeKey] = i.nome;
    if (i.valor !== null && i.valor !== undefined) lastValor[i.nomeKey] = i.valor;
  });
  rows.push([]);
  rows.push(['Resumo por modelo']);
  rows.push(['Modelo', 'Quantidade total', 'Valor unitário', 'Subtotal']);
  let grandTotalValue = 0;
  Object.keys(counts).sort((a, b) => counts[b] - counts[a]).forEach(k => {
    const qty = counts[k];
    const valor = lastValor[k];
    const subtotal = valor !== undefined ? valor * qty : null;
    if (subtotal !== null) grandTotalValue += subtotal;
    rows.push([displayNames[k], qty, valor !== undefined ? valor.toFixed(2) : '', subtotal !== null ? subtotal.toFixed(2) : '']);
  });
  rows.push(['Total geral', items.length, '', grandTotalValue.toFixed(2)]);

  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\n');
  downloadFile(`catalogo-fantasias-${todayStr()}.csv`, '\uFEFF' + csv, 'text/csv;charset=utf-8');
}

loadItems();
</script>
</body>
</html>
